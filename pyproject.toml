[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-guard-lab"
version = "0.1.0"
description = "Prototipo académico WireGuard con detección y diagnóstico reproducible"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.7,<2", "joblib>=1.4,<2", "psutil>=6,<8"]

[project.scripts]
vpn-guard = "vpn_guard.cli:main"

[tool.setuptools.packages.find]
include = ["vpn_guard*"]
